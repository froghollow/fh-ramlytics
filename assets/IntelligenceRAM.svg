<svg width="260" height="80" viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0B1024"/>
    </linearGradient>
    <linearGradient id="ramCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="260" height="80" rx="12" fill="url(#bgGrid)"/>

  <!-- Hexagon "intelligence engine" core -->
  <polygon
    points="70,20 95,32 95,56 70,68 45,56 45,32"
    fill="#0F172A"
    stroke="url(#ramCore)"
    stroke-width="2.5"
  />

  <!-- Inner RAM monogram -->
  <text x="47" y="50"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="18"
        font-weight="600"
        letter-spacing="3"
        fill="url(#ramCore)">
    RAM
  </text>

  <!-- Network nodes around hexagon -->
  <circle cx="70" cy="10" r="3" fill="#22C55E"/>
  <circle cx="105" cy="30" r="2.5" fill="#06B6D4"/>
  <circle cx="105" cy="60" r="2.5" fill="#6366F1"/>
  <circle cx="70" cy="75" r="3" fill="#22C55E"/>
  <circle cx="35" cy="60" r="2.5" fill="#06B6D4"/>
  <circle cx="35" cy="30" r="2.5" fill="#6366F1"/>

  <!-- Connecting lines (data graph) -->
  <polyline points="70,10 105,30 105,60 70,75 35,60 35,30 70,10"
            fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wordmark: RAMLYTICS -->
  <text x="120" y="42"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="22"
        font-weight="600"
        letter-spacing="3"
        fill="#E5E7EB">
    RAMLYTICS 
  </text>

  <!-- Subtitle -->
  <text x="120" y="60"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="10"
        letter-spacing="2"
        fill="#9CA3AF">
    INTELLIGENCE ENGINE
  </text>
</svg>
