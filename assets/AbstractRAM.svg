<svg width="220" height="70" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="220" height="70" fill="#0A0C16"/>

  <!-- Left horn -->
  <path d="M40 35
           C25 20, 15 25, 18 38
           C20 48, 30 50, 38 42"
        fill="none" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>

  <!-- Right horn (mirrored) -->
  <path d="M60 35
           C75 20, 85 25, 82 38
           C80 48, 70 50, 62 42"
        fill="none" stroke="#FFB347" stroke-width="3" stroke-linecap="round"/>

  <!-- Central circle (head) -->
  <circle cx="50" cy="35" r="8" fill="#FFB347"/>

  <!-- RAM wordmark -->
  <text x="100" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" fill="#FFFFFF" font-weight="600" letter-spacing="2">
    RAM
  </text>

  <!-- Subtitle -->
  <text x="100" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12" fill="#9FB3FF" letter-spacing="2">
    PORTFOLIO ANALYTICS
  </text>
</svg>
