<svg width="220" height="70" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="220" height="70" fill="#050814"/>

  <!-- Signal line behind text -->
  <polyline points="10,50 30,40 50,45 70,30 90,35 110,20 130,32 150,25 170,40 190,28 210,35"
            fill="none" stroke="#35E0A8" stroke-width="2" stroke-linecap="round"/>

  <!-- RAM wordmark -->
  <text x="20" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" fill="#FFFFFF" font-weight="600">
    RAM
  </text>

  <!-- Vertical separator -->
  <line x1="85" y1="20" x2="85" y2="50" stroke="#35E0A8" stroke-width="2"/>

  <!-- App name -->
  <text x="95" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" fill="#9FB3FF" letter-spacing="1">
    LYTICS
  </text>
</svg>
