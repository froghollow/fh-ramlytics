<svg width="260" height="80" viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0B1024"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="260" height="80" rx="12" fill="url(#bgGrad)"/>

  <!-- Tech underline that becomes a rising chart -->
  <path d="M30 55 H80 L105 45 L130 50 L155 35 L180 40 L210 30"
        fill="none" stroke="#38BDF8" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glow behind RAM -->
  <ellipse cx="95" cy="38" rx="70" ry="22" fill="#1D2A4A" opacity="0.6"/>

  <!-- RAM wordmark (futuristic) -->
  <text x="40" y="42"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="26"
        font-weight="600"
        letter-spacing="4"
        fill="url(#ramGrad)">
    RAM
  </text>

  <!-- App name / suffix -->
  <text x="135" y="42"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="18"
        letter-spacing="3"
        fill="#E5E7EB">
    LYTICS
  </text>

  <!-- Small tech dots -->
  <circle cx="210" cy="30" r="3" fill="#38BDF8"/>
  <circle cx="180" cy="40" r="2.5" fill="#6366F1"/>
  <circle cx="155" cy="35" r="2.5" fill="#A855F7"/>
</svg>
