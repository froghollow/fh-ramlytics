[project]
name = "ramlytics"
version = "0.1.0"
description = "RAMlytics analytics and workflow project."
readme = "README.md"
authors = [
    { name = "Richard", email = "richard@frog-hollow.net" }
]
requires-python = ">=3.12"
dependencies = [
    "agents>=1.4.0",
    "dotenv>=0.9.9",
    "edgartools[ai]>=5.61.1",
    "fonttools>=4.68.0",
    "mineru-open-sdk>=0.2.5",
    "openai-agents[litellm]>=0.23.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.19.0",
    "ramlytics-database",
    "rauth>=0.7.3",
    "requests-oauthlib>=2.0.0",
]

[project.scripts]
ramlytics = "ramlytics:main"

[tool.uv.workspace]


members = [
    "backend/database",
    "backend/dyndb_load_json",
    "backend/yfinance",
]

[tool.uv.sources]
ramlytics-database = { workspace = true }
ramlytics-yfinance = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
