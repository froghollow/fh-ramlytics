[project]
name = "ramlytics-yfinance"
version = "0.1.0"
description = "Yahoo Finance ticker utilities for RAMlytics."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "yfinance>=0.2.0",
    "pytz>=2024.1",
    "holidays>=0.55",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
